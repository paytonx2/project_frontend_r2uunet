<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-NET INSPECTION PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 12px; }
        video, canvas { background: #000; width: 100%; border-radius: 16px; border: 2px solid #fff; min-height: 250px; }
        .active-mode { background-color: #2563eb !important; color: white !important; }
        input[type=range] { width: 100%; cursor: pointer; }
        .compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
        .img-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; pointer-events: none; z-index: 10; }
        .result-card { transition: all 0.3s ease; overflow: hidden; }
        .collapsed .compare-container { display: none; }
        .rotate-180 { transform: rotate(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ แผงควบคุม</h2>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2">Pixel Threshold (พื้นที่จุดบกพร่อง)</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-blue-400 font-bold">
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm text-slate-400">Confidence (ความมั่นใจ)</label>
                    <span id="valConfidence" class="text-blue-400 font-bold">0.35</span>
                </div>
                <input type="range" id="inpConfidence" min="0.10" max="0.95" step="0.05" value="0.35" 
                    oninput="document.getElementById('valConfidence').innerText = parseFloat(this.value).toFixed(2)">
            </div>

            <hr class="border-slate-800">

            <div class="p-4 bg-slate-800 rounded-2xl border border-slate-700">
                <button onclick="exportToCSV()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition-all shadow-lg mb-2">📊 Download CSV</button>
                <p id="logCount" class="text-[10px] text-center text-slate-500">บันทึกแล้ว: 0 รายการ</p>
            </div>

            <div id="systemLog" class="log-box text-xs">ระบบพร้อม...</div>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl font-bold border border-slate-700 mt-4">🔄 รีเซ็ตหน้าเว็บ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 border-b pb-8">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">R2U-NET <span class="text-blue-600">PRO</span></h1>
            <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
                <button onclick="setMode('image')" id="btnImage" class="px-6 py-2.5 rounded-xl font-bold transition-all text-slate-500">📷 รูปภาพ</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2.5 rounded-xl font-bold transition-all active-mode text-white">🎥 วิดีโอ/กล้องสด</button>
            </div>
        </header>

        <div id="videoSection" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">อัปโหลดวิดีโอ (.mp4, .mov)</p>
                    <input type="file" id="videoInput" accept="video/*" class="w-full text-sm" onchange="handleVideoUpload(this)">
                </div>
                <div class="flex items-end gap-2">
                    <button id="camBtn" onclick="toggleCamera()" class="flex-1 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-black transition-all">📹 เปิดกล้อง</button>
                    <button id="runBtn" onclick="toggleAI()" disabled class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl opacity-50 cursor-not-allowed transition-all">▶️ เริ่มรัน AI</button>
                </div>
            </div>
            
            <div id="vStatus" class="text-center py-5 rounded-2xl text-xl font-bold bg-slate-100 text-slate-400 border border-slate-200 uppercase tracking-widest transition-all duration-300">
                รอการเชื่อมต่อ...
            </div>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div>
                    <p class="text-sm font-bold text-slate-500 mb-2 flex items-center gap-2">🟢 Original Feed</p>
                    <video id="vSource" muted playsinline loop crossorigin="anonymous" class="shadow-lg"></video>
                </div>
                <div>
                    <p class="text-sm font-bold text-blue-600 mb-2 flex items-center gap-2">🔵 AI Detection (Result View)</p>
                    <canvas id="vCanvas" class="shadow-lg"></canvas>
                </div>
            </div>
        </div>

        <div id="imageSection" class="hidden space-y-6">
            <div onclick="document.getElementById('imageInput').click()" class="group bg-white p-12 rounded-[2rem] border-4 border-dashed border-slate-200 text-center cursor-pointer hover:border-blue-400 transition-all shadow-sm">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-600 font-bold text-xl">📤 คลิกเพื่ออัปโหลดรูปภาพ (Before/After)</p>
            </div>
            <div id="imageResultsList" class="flex flex-col gap-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://phuwarin-my-cnn-api.hf.space/predict"; 
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d');
        const systemLog = document.getElementById('systemLog');
        
        let isCameraOpen = false;
        let isAIRunning = false;
        let inspectionData = [];

        function addLog(msg) {
            systemLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        function toggleCollapse(id) {
            document.getElementById(`card-${id}`).classList.toggle('collapsed');
            document.getElementById(`arrow-${id}`).classList.toggle('rotate-180');
        }

        // ฟังก์ชันโหลดวิดีโอที่เสถียรขึ้น
        function handleVideoUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const url = URL.createObjectURL(file);
                
                if (isCameraOpen) stopAll();
                
                vSource.srcObject = null;
                vSource.src = url;
                vSource.muted = true; // จำเป็นสำหรับการเล่นอัตโนมัติ
                
                vSource.onloadedmetadata = () => {
                    vSource.play().then(() => {
                        vCanvas.width = vSource.videoWidth;
                        vCanvas.height = vSource.videoHeight;
                        document.getElementById('runBtn').disabled = false;
                        document.getElementById('runBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                        addLog("🎞️ โหลดวิดีโอ: " + file.name);
                    }).catch(err => addLog("❌ เล่นวิดีโอไม่ได้: " + err.message));
                };
            }
        }

        async function toggleCamera() {
            if (!isCameraOpen) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    vSource.src = "";
                    vSource.srcObject = stream;
                    vSource.onloadedmetadata = () => {
                        vSource.play();
                        vCanvas.width = vSource.videoWidth;
                        vCanvas.height = vSource.videoHeight;
                        isCameraOpen = true;
                        document.getElementById('camBtn').innerText = "🚫 ปิดกล้อง";
                        document.getElementById('runBtn').disabled = false;
                        document.getElementById('runBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                        addLog("📸 เปิดกล้องสำเร็จ");
                    };
                } catch (e) { addLog("❌ เข้าถึงกล้องไม่ได้"); }
            } else { stopAll(); }
        }

        function toggleAI() {
            isAIRunning = !isAIRunning;
            const btn = document.getElementById('runBtn');
            btn.innerText = isAIRunning ? "⏸️ หยุดรัน AI" : "▶️ เริ่มรัน AI";
            btn.className = isAIRunning ? "flex-1 py-3 bg-red-500 text-white font-bold rounded-xl shadow-lg" : "flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg";
            if (isAIRunning) {
                addLog("🚀 AI กำลังประมวลผล...");
                renderLoop();
            }
        }

        function stopAll() {
            isCameraOpen = false;
            isAIRunning = false;
            if (vSource.srcObject) vSource.srcObject.getTracks().forEach(t => t.stop());
            vSource.srcObject = null;
            vSource.src = "";
            document.getElementById('camBtn').innerText = "📹 เปิดกล้อง";
            document.getElementById('runBtn').disabled = true;
            document.getElementById('runBtn').classList.add('opacity-50', 'cursor-not-allowed');
            addLog("⏹️ ปิดการเชื่อมต่อ");
        }

        // --- หัวใจสำคัญ: ส่งเฟรมและรับภาพที่ AI วาดแล้วมาแสดง ---
        async function renderLoop() {
            if (!isAIRunning || vSource.paused || vSource.ended) return;

            // วาดเฟรมปัจจุบันลงแคนวาสเพื่อดึง Blob
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);
            
            vCanvas.toBlob(async (blob) => {
                if (!blob || !isAIRunning) return;
                
                const fd = new FormData();
                fd.append('image', blob, 'frame.jpg');
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', document.getElementById('inpConfidence').value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success && isAIRunning) {
                        const img = new Image();
                        img.onload = () => {
                            // เคลียร์แคนวาสแล้ววาดภาพที่ได้จาก Backend (ที่มีสีแดง/กรอบเขียว)
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            
                            updateStatus(data.status, data.pixel_count);
                            
                            // วนลูปเฟรมถัดไปทันที
                            requestAnimationFrame(renderLoop);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) { 
                    if(isAIRunning) setTimeout(renderLoop, 200); 
                }
            }, 'image/jpeg', 0.6); // ปรับคุณภาพภาพส่งออกเล็กน้อยเพื่อความเร็ว
        }

        function updateStatus(s, px) {
            const el = document.getElementById('vStatus');
            if (s === "MISSING") {
                el.innerText = `🚨 DETECTED: ${px} PX`;
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-red-600 text-white shadow-[0_0_25px_rgba(220,38,38,0.6)] uppercase tracking-widest";
            } else {
                el.innerText = "✅ STATUS: NORMAL";
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-green-500 text-white uppercase tracking-widest";
            }
        }

        // ระบบรูปภาพ (เหมือนเดิมแต่แมตช์ชื่อตัวแปร Backend)
        document.getElementById('imageInput').onchange = async (e) => {
            for (let file of e.target.files) {
                const id = 'img-' + Math.random().toString(36).substr(2, 5);
                const originalUrl = URL.createObjectURL(file);
                
                const cardHtml = `
                    <div id="card-${id}" class="result-card bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden mb-4">
                        <div onclick="toggleCollapse('${id}')" class="flex justify-between items-center p-4 bg-slate-50 cursor-pointer border-b">
                            <div class="flex items-center gap-3">
                                <span id="arrow-${id}" class="text-slate-400 transition-transform">▼</span>
                                <span class="bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] font-bold">${file.name}</span>
                                <p id="st-${id}" class="font-bold text-slate-400 text-sm italic">วิเคราะห์...</p>
                            </div>
                            <button onclick="event.stopPropagation(); document.getElementById('card-${id}').remove()" class="text-red-400 text-xs font-bold px-2">ลบ</button>
                        </div>
                        <div class="compare-container p-6 pt-2">
                            <div class="relative"><span class="img-label">ORIGINAL</span><img src="${originalUrl}" class="w-full h-auto rounded-xl border"></div>
                            <div class="relative">
                                <span class="img-label">AI PREDICTED</span>
                                <img id="${id}" class="w-full h-auto rounded-xl border min-h-[250px] bg-slate-50">
                                <div id="loader-${id}" class="absolute inset-0 flex items-center justify-center bg-white/60"><div class="animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div></div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', cardHtml);

                const fd = new FormData();
                fd.append('image', file);
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', document.getElementById('inpConfidence').value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    document.getElementById(id).src = "data:image/jpeg;base64," + data.image;
                    document.getElementById(`loader-${id}`).classList.add('hidden');
                    const statusEl = document.getElementById(`st-${id}`);
                    statusEl.innerText = data.status === "MISSING" ? `🚨 MISSING (${data.pixel_count} px)` : `✅ GOOD`;
                    statusEl.className = `font-bold text-sm ${data.status === 'MISSING' ? 'text-red-600' : 'text-green-600'}`;
                    inspectionData.push({ time: new Date().toLocaleTimeString(), file: file.name, status: data.status, px: data.pixel_count });
                    document.getElementById('logCount').innerText = `บันทึกแล้ว: ${inspectionData.length} รายการ`;
                } catch (error) { document.getElementById(`st-${id}`).innerText = "❌ Error"; }
            }
            e.target.value = "";
        };

        function setMode(m) {
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('btnImage').classList.toggle('active-mode', m === 'image');
            document.getElementById('btnVideo').classList.toggle('active-mode', m === 'video');
        }

        function exportToCSV() {
            if (inspectionData.length === 0) return alert("ไม่มีข้อมูล");
            let csv = "Time,Source,Status,Pixels\n" + inspectionData.map(r => `${r.time},${r.file || 'Live'},${r.status},${r.px}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Report_${Date.now()}.csv`);
            a.click();
        }
    </script>
</body>
</html>
