<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Inspection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 12px; }
        video, canvas { background: #000; width: 100%; border-radius: 16px; border: 2px solid #fff; min-height: 250px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-400 font-bold">⚙️ แผงควบคุม</h2>
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2 font-bold">Pixel Threshold (ความไว)</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-2 rounded-lg border border-slate-700 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2 font-bold">Confidence: <span id="confVal" class="text-blue-400">0.35</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full accent-blue-500">
            </div>
            
            <div class="pt-2">
                <p class="text-[10px] text-slate-500 uppercase font-bold mb-2">System Logs</p>
                <div id="systemLog" class="log-box">เชื่อมต่อกับ: cf2a...</div>
            </div>

            <button onclick="location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all border border-slate-700">🔄 รีเซ็ตระบบ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 border-b pb-6">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">R2U-NET <span class="text-blue-600">INSPECTION</span></h1>
            <p class="text-slate-500 italic">เลือกวิดีโอเพื่อเริ่มการตรวจจับความผิดปกติ</p>
        </header>

        <div id="videoSection" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-4 items-center">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">1. เลือกไฟล์วิดีโอ</label>
                    <input type="file" id="videoInput" accept="video/*" class="w-full text-sm">
                </div>
                <button onclick="startAI()" id="startBtn" class="w-full sm:w-auto px-10 py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg transition-all active:scale-95">2. เริ่มวิเคราะห์ทันที</button>
            </div>
            
            <div id="vStatus" class="text-center py-5 rounded-2xl text-xl font-bold bg-slate-100 text-slate-400 border border-slate-200">สถานะ: รอการโหลดไฟล์</div>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-500 uppercase px-2">วิดีโอต้นฉบับ (Original)</p>
                    <video id="vSource" controls muted playsinline></video>
                </div>
                <div class="space-y-2">
                    <p class="text-xs font-bold text-blue-600 uppercase px-2 font-bold">ผลการวิเคราะห์ AI (Result)</p>
                    <canvas id="vCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL ใหม่ของคุณที่อัปเดตแล้ว
        const API_URL = "https://cf2a-223-206-219-65.ngrok-free.app/predict"; 
        
        const systemLog = document.getElementById('systemLog');
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d');
        const confSli = document.getElementById('confThreshold');
        const pxInp = document.getElementById('pxThreshold');

        function addLog(msg) {
            systemLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        confSli.oninput = () => document.getElementById('confVal').innerText = confSli.value;

        // เมื่อเลือกไฟล์วิดีโอ
        document.getElementById('videoInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                addLog("📂 โหลดไฟล์วิดีโอใหม่...");
                const url = URL.createObjectURL(file);
                vSource.src = url;
                vSource.muted = true; 
                vSource.load();
                
                vSource.onloadeddata = () => {
                    vCanvas.width = vSource.videoWidth;
                    vCanvas.height = vSource.videoHeight;
                    document.getElementById('vStatus').innerText = "✅ พร้อมใช้งาน! กดปุ่มเริ่มวิเคราะห์";
                    addLog("วิดีโอพร้อมแสดงผล (" + vSource.videoWidth + "x" + vSource.videoHeight + ")");
                    
                    // แสดงภาพแรกทันทีที่โหลดเสร็จ
                    ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);
                };
            }
        };

        // เริ่มต้นการทำงาน
        async function startAI() {
            if (!vSource.src) return alert("กรุณาเลือกไฟล์วิดีโอก่อนครับ");
            
            try {
                addLog("🚀 กำลังสั่งรัน AI...");
                await vSource.play(); 
                document.getElementById('vStatus').innerText = "🌀 กำลังประมวลผล...";
                processFrame();
            } catch (err) {
                addLog("⚠️ Browser บล็อก: คลิกที่วิดีโอหนึ่งครั้งเพื่อเริ่ม");
            }
        }

        function processFrame() {
            if (vSource.paused || vSource.ended) return;

            // วาดภาพสดๆ จากวิดีโอลง Canvas ก่อน
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);

            vCanvas.toBlob(async (blob) => {
                if(!blob) return;
                
                const fd = new FormData();
                fd.append('image', blob, 'frame.jpg');
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success && data.image) {
                        const img = new Image();
                        img.onload = () => {
                            // เคลียร์และวาดภาพที่ AI ใส่ Mask กลับมา
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            updateVStatus(data.status, data.pixel_count);
                            requestAnimationFrame(processFrame);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    } else {
                        requestAnimationFrame(processFrame);
                    }
                } catch (e) {
                    addLog("❌ ติดต่อ Server ไม่ได้... กำลังลองใหม่");
                    setTimeout(processFrame, 1000);
                }
            }, 'image/jpeg', 0.5);
        }

        function updateVStatus(s, px) {
            const el = document.getElementById('vStatus');
            if (s === "MISSING") {
                el.innerText = `🚨 ตรวจพบความผิดปกติ (${px} พิกเซล)`;
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-red-600 text-white animate-pulse shadow-lg";
            } else {
                el.innerText = "✅ สถานะ: ชิ้นส่วนครบถ้วน";
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-green-500 text-white shadow-lg";
            }
        }
    </script>
</body>
</html>
