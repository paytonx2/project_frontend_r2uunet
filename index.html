<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-Net Pro Dashboard | Inspect System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .log-box { font-family: 'Courier New', monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #4ade80; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        #vCanvas { background-color: #000; width: 100%; height: auto; border-radius: 12px; border: 2px solid #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 shadow-2xl flex-shrink-0">
        <h2 class="text-2xl font-black mb-6 text-blue-400 tracking-tighter uppercase">R2U-Net Control</h2>
        
        <div class="mb-6 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Pixel Threshold</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-white">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Confidence: <span id="confVal" class="text-blue-400">0.35</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
        </div>

        <div class="mb-6">
            <p class="text-[10px] font-bold uppercase text-slate-500 mb-2">System Live Logs</p>
            <div id="systemLog" class="log-box">Initialized... Ready.</div>
        </div>

        <button onclick="window.location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-bold transition-all">
            🔄 REBOOT SYSTEM
        </button>
    </div>

    <div class="flex-1 p-4 md:p-10 overflow-y-auto">
        <header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-800 tracking-tight uppercase">Defect Inspection</h1>
                <p class="text-slate-500 font-medium italic">R2U-Net Model Implementation</p>
            </div>
            <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
                <button onclick="setMode('image')" id="btnImage" class="px-6 py-2.5 rounded-xl font-bold transition-all bg-blue-600 text-white">📷 IMAGE</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2.5 rounded-xl font-bold transition-all bg-slate-50 text-slate-500">🎥 VIDEO</button>
            </div>
        </header>

        <div id="imageSection" class="space-y-6">
            <div class="bg-white p-12 rounded-[2rem] border-4 border-dashed border-slate-200 text-center hover:border-blue-400 transition-all cursor-pointer" onclick="document.getElementById('imageInput').click()">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-600 font-bold text-lg">📤 เลือกรูปภาพ (หลายรูปพร้อมกัน)</p>
            </div>
            <div id="imageResultsList" class="grid grid-cols-1 gap-6"></div>
        </div>

        <div id="videoSection" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center">
                <input type="file" id="videoInput" accept="video/*" class="flex-1 text-slate-500">
                <button onclick="forceStartAnalysis()" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span>▶️</span> START AI ANALYSIS
                </button>
            </div>
            
            <div id="vStatus" class="text-center py-4 rounded-2xl text-2xl font-black bg-slate-200 text-slate-400 uppercase">Step: 1.Upload  2.Press Start Button</div>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-400 uppercase pl-2">Input Stream</p>
                    <video id="vSource" controls class="w-full rounded-3xl bg-black shadow-2xl aspect-video"></video>
                </div>
                <div class="space-y-2">
                    <p class="text-xs font-bold text-blue-500 uppercase pl-2">AI Visualization</p>
                    <canvas id="vCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // *** ตั้งค่า URL ให้ตรงกับ Hugging Face ของคุณ ***
        const API_URL = "https://phuwarin-my-cnn-api.hf.space/predict"; 
        
        const systemLog = document.getElementById('systemLog');
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d', { willReadFrequently: true });
        const confSli = document.getElementById('confThreshold');
        const pxInp = document.getElementById('pxThreshold');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            systemLog.innerHTML += `<div>[${time}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
            console.log(msg);
        }

        function setMode(m) {
            addLog("Switch Mode: " + m);
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('btnImage').className = m === 'image' ? 'px-6 py-2.5 rounded-xl font-bold bg-blue-600 text-white shadow-lg' : 'px-6 py-2.5 rounded-xl font-bold bg-slate-50 text-slate-500';
            document.getElementById('btnVideo').className = m === 'video' ? 'px-6 py-2.5 rounded-xl font-bold bg-blue-600 text-white shadow-lg' : 'px-6 py-2.5 rounded-xl font-bold bg-slate-50 text-slate-500';
            if(m === 'image') vSource.pause();
        }

        confSli.oninput = () => document.getElementById('confVal').innerText = confSli.value;

        // --- IMAGE LOGIC (Multiple) ---
        document.getElementById('imageInput').onchange = async (e) => {
            const files = e.target.files;
            addLog(`Processing ${files.length} images...`);
            for (let file of files) {
                const id = 'img-' + Math.random().toString(36).substr(2, 5);
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', `
                    <div id="${id}" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col md:flex-row gap-6 animate-pulse">
                        <div class="w-full md:w-1/3"><img src="${URL.createObjectURL(file)}" class="w-full h-40 object-contain rounded-2xl bg-slate-50"></div>
                        <div class="flex-1 flex flex-col justify-center text-center md:text-left">
                            <h4 class="font-black text-slate-700 truncate">${file.name}</h4>
                            <div id="st-${id}" class="text-2xl font-black text-blue-500 uppercase">Analyzing...</div>
                        </div>
                        <div class="w-full md:w-1/3"><img id="res-${id}" class="w-full h-40 object-contain rounded-2xl border-2 border-blue-500 hidden bg-slate-900 shadow-xl"></div>
                    </div>
                `);
                const fd = new FormData();
                fd.append('image', file);
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    const card = document.getElementById(id);
                    card.classList.remove('animate-pulse');
                    document.getElementById('res-'+id).src = "data:image/jpeg;base64," + data.image;
                    document.getElementById('res-'+id).classList.remove('hidden');
                    const st = document.getElementById('st-'+id);
                    st.innerText = data.status;
                    st.className = `text-3xl font-black uppercase ${data.status === 'MISSING' ? 'text-red-600' : 'text-green-600'}`;
                } catch(err) { addLog("API Error on Image"); }
            }
        };

        // --- VIDEO LOGIC (The Fixed Engine) ---
        document.getElementById('videoInput').onchange = (e) => {
            vSource.src = URL.createObjectURL(e.target.files[0]);
            addLog("Video Loaded.");
            document.getElementById('vStatus').innerText = "STREAM READY: PRESS START";
        };

        async function forceStartAnalysis() {
            if (!vSource.src) { alert("กรุณาเลือกไฟล์วิดีโอก่อนครับ!"); return; }
            addLog("Manual Start Triggered...");
            try {
                await vSource.play();
                startAnalysisLoop();
            } catch (err) { addLog("Play Error: " + err.message); startAnalysisLoop(); }
        }

        async function startAnalysisLoop() {
            if (vSource.ended) { addLog("Video Finished."); return; }
            if (vCanvas.width !== vSource.videoWidth) {
                vCanvas.width = vSource.videoWidth;
                vCanvas.height = vSource.videoHeight;
            }
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);
            vCanvas.toBlob(async (blob) => {
                if(!blob) return;
                const fd = new FormData();
                fd.append('image', blob, 'f.jpg');
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            updateVStatus(data.status);
                            if(!vSource.paused) requestAnimationFrame(startAnalysisLoop);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) {
                    addLog("API Delay/Error...");
                    if(!vSource.paused) setTimeout(startAnalysisLoop, 1000);
                }
            }, 'image/jpeg', 0.5);
        }

        function updateVStatus(s) {
            const el = document.getElementById('vStatus');
            el.innerText = s === "MISSING" ? "🚨 DEFECT: MISSING DETECTED" : "✅ STATUS: GOOD";
            el.className = `text-center py-4 rounded-xl text-2xl font-black ${s === 'MISSING' ? 'bg-red-600 text-white animate-pulse' : 'bg-green-500 text-white'}`;
        }
    </script>
</body>
</html>
