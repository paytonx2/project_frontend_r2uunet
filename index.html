<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-NET TURBO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; }
        .log-box { font-family: monospace; font-size: 11px; height: 100px; overflow-y: auto; background: rgba(0,0,0,0.5); color: #22c55e; padding: 10px; border-radius: 12px; border: 1px solid #1e293b; }
        video, canvas { background: #000; width: 100%; border-radius: 20px; border: 2px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-slate-800/50 p-6 rounded-3xl backdrop-blur-md border border-slate-700">
            <div>
                <h1 class="text-3xl font-black text-blue-400">R2U-NET <span class="text-white">TURBO</span></h1>
                <p class="text-slate-400 text-sm">High-Speed Video Inspection</p>
            </div>
            <div class="flex gap-2 bg-slate-900 p-1 rounded-xl">
                <button onclick="setMode('image')" id="btnImage" class="px-4 py-2 rounded-lg font-bold text-slate-400">📷 ภาพ</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-4 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg">🎥 วิดีโอ</button>
            </div>
        </header>

        <div id="videoSection" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-slate-800/50 p-6 rounded-3xl border border-slate-700 shadow-xl">
                    <label class="block text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">1. เลือกวิดีโอ (รองรับไฟล์ใหญ่)</label>
                    <input type="file" id="videoInput" accept="video/*" 
                           class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
                           onchange="instantProcess(this)">
                    
                    <div class="mt-6 space-y-4">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">ความไวการตรวจจับ (Pixel)</label>
                            <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-900 p-2 rounded-lg border border-slate-700 outline-none focus:border-blue-500">
                        </div>
                        <div id="systemLog" class="log-box">ระบบพร้อม...</div>
                    </div>
                </div>
                
                <div id="vStatus" class="p-6 rounded-3xl text-center text-2xl font-black bg-slate-800 border border-slate-700 text-slate-500 shadow-inner">
                    READY
                </div>
            </div>

            <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-500 uppercase ml-2">Original Stream</p>
                    <video id="vSource" muted playsinline class="w-full"></video>
                </div>
                <div class="space-y-2">
                    <p class="text-xs font-bold text-blue-400 uppercase ml-2">AI Real-time Result</p>
                    <canvas id="vCanvas"></canvas>
                </div>
            </div>
        </div>

        <div id="imageSection" class="hidden">
             <input type="file" id="imageInput" accept="image/*" multiple onchange="processImages(this)">
             <div id="imageResultsList" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://cf2a-223-206-219-65.ngrok-free.app/predict"; 
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d', { alpha: false, desynchronized: true });
        
        function addLog(msg) {
            const log = document.getElementById('systemLog');
            log.innerHTML += `<div>> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function setMode(m) {
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('btnImage').className = m === 'image' ? "px-4 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg" : "px-4 py-2 rounded-lg font-bold text-slate-400";
            document.getElementById('btnVideo').className = m === 'video' ? "px-4 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg" : "px-4 py-2 rounded-lg font-bold text-slate-400";
        }

        // --- ไม้ตาย: Instant Process ---
        async function instantProcess(input) {
            const file = input.files[0];
            if (!file) return;

            addLog("⚡ กำลังเชื่อมต่อ Stream...");
            const url = URL.createObjectURL(file);
            vSource.src = url;
            
            // ไม่ต้องรอโหลด metadata นาน สั่งรันทันทีที่เริ่มเล่นได้
            vSource.oncanplay = async () => {
                vCanvas.width = vSource.videoWidth;
                vCanvas.height = vSource.videoHeight;
                try {
                    await vSource.play();
                    addLog("🚀 AI กำลังประมวลผลทันที...");
                    requestAnimationFrame(renderLoop);
                } catch (e) {
                    addLog("⚠️ โปรดคลิกที่หน้าจอเพื่อเริ่ม");
                }
            };
        }

        async function renderLoop() {
            if (vSource.paused || vSource.ended) return;

            // บีบอัดภาพก่อนส่ง (ช่วยไฟล์ 150MB ให้รันลื่นขึ้น)
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);
            
            // ใช้ความละเอียด 0.4 (40%) เพื่อความเร็วในการส่งข้อมูลผ่าน ngrok
            vCanvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('image', blob, 'f.jpg');
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', "0.35");

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            const st = document.getElementById('vStatus');
                            st.innerText = data.status === "MISSING" ? "🚨 ANOMALY" : "✅ NORMAL";
                            st.className = `p-6 rounded-3xl text-center text-2xl font-black shadow-inner transition-all ${data.status === 'MISSING' ? 'bg-red-600 text-white animate-pulse' : 'bg-green-500 text-white'}`;
                            requestAnimationFrame(renderLoop);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) { requestAnimationFrame(renderLoop); }
            }, 'image/jpeg', 0.4); 
        }

        // --- ระบบรูปภาพ (คงเดิม) ---
        async function processImages(input) {
            for (let file of input.files) {
                const id = Math.random().toString(36).substr(2, 5);
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', `
                    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                        <p id="st-${id}" class="text-blue-400 font-bold mb-2">Analyzing...</p>
                        <img id="img-${id}" class="w-full rounded-lg">
                    </div>
                `);
                const fd = new FormData();
                fd.append('image', file);
                const res = await fetch(API_URL, { method: 'POST', body: fd });
                const data = await res.json();
                const img = document.getElementById(`img-${id}`);
                img.src = "data:image/jpeg;base64," + data.image;
                document.getElementById(`st-${id}`).innerText = data.status;
            }
        }
    </script>
</body>
</html>
