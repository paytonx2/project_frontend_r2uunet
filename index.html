<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-Net Detection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 100px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 10px; border-radius: 8px; }
        video, canvas { background: #000; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ แผงควบคุม</h2>
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2">Pixel Threshold</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-2 rounded-lg border border-slate-700 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">Confidence: <span id="confVal" class="text-blue-400">0.35</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full h-2 bg-slate-700 rounded-lg appearance-none accent-blue-500">
            </div>
            <div id="systemLog" class="log-box p-3 mt-4 text-[10px]">ระบบพร้อมทำงาน (Local Mode)</div>
            <button onclick="location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all mt-4">🔄 รีโหลดระบบ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center border-b pb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">R2U-NET INSPECTION</h1>
                <p class="text-slate-500 italic">การตรวจสอบความผิดปกติด้วยระบบ AI</p>
            </div>
            <div class="flex gap-2 bg-white p-1 rounded-2xl shadow-sm border">
                <button onclick="setMode('image')" id="btnImage" class="mode-btn px-6 py-2 rounded-xl font-bold bg-blue-600 text-white">📷 รูปภาพ</button>
                <button onclick="setMode('video')" id="btnVideo" class="mode-btn px-6 py-2 rounded-xl font-bold text-slate-500">🎥 วิดีโอ</button>
            </div>
        </header>

        <div id="imageSection" class="space-y-6">
            <div onclick="document.getElementById('imageInput').click()" class="bg-white p-10 rounded-3xl border-4 border-dashed border-slate-200 text-center cursor-pointer hover:border-blue-400 transition-all shadow-sm">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-500 font-bold text-lg">คลิกเพื่อเลือกรูปภาพชิ้นส่วน</p>
                <p class="text-slate-400 text-sm">ระบบจะประมวลผลผ่านเครื่อง Local ของคุณ</p>
            </div>
            <div id="imageResultsList" class="space-y-4"></div>
        </div>

        <div id="videoSection" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border flex gap-4">
                <input type="file" id="videoInput" accept="video/*" class="flex-1">
                <button onclick="startAI()" class="px-8 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">▶️ เริ่มวิเคราะห์</button>
            </div>
            <div id="vStatus" class="text-center py-4 rounded-xl text-xl font-bold bg-slate-100 text-slate-400">กรุณาเลือกไฟล์วิดีโอ</div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div><p class="text-xs font-bold text-slate-400 mb-2 uppercase">วิดีโอต้นฉบับ</p><video id="vSource" controls muted></video></div>
                <div><p class="text-xs font-bold text-blue-500 mb-2 uppercase">ผลการวิเคราะห์ AI</p><canvas id="vCanvas"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        // *** เช็ค URL ตรงนี้ให้ตรงกับ ngrok ปัจจุบันของคุณ ***
        const API_URL = "https://adff-223-206-219-65.ngrok-free.app/predict"; 
        
        const systemLog = document.getElementById('systemLog');
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d', { willReadFrequently: true });
        const confSli = document.getElementById('confThreshold');
        const pxInp = document.getElementById('pxThreshold');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            systemLog.innerHTML += `<div>[${time}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        // ฟังก์ชันสลับโหมดที่แก้ไขแล้ว
        function setMode(m) {
            addLog("สลับไปโหมด: " + (m === 'image' ? 'รูปภาพ' : 'วิดีโอ'));
            document.getElementById('imageSection').style.display = m === 'image' ? 'block' : 'none';
            document.getElementById('videoSection').style.display = m === 'video' ? 'block' : 'none';
            
            document.getElementById('btnImage').className = m === 'image' ? 'px-6 py-2 rounded-xl font-bold bg-blue-600 text-white' : 'px-6 py-2 rounded-xl font-bold text-slate-500';
            document.getElementById('btnVideo').className = m === 'video' ? 'px-6 py-2 rounded-xl font-bold bg-blue-600 text-white' : 'px-6 py-2 rounded-xl font-bold text-slate-500';
            
            if(m === 'image') {
                vSource.pause();
            }
        }

        confSli.oninput = () => document.getElementById('confVal').innerText = confSli.value;

        // การวิเคราะห์รูปภาพ
        document.getElementById('imageInput').onchange = async (e) => {
            if (!e.target.files.length) return;
            addLog(`ได้รับรูปภาพ ${e.target.files.length} ไฟล์`);

            for (let file of e.target.files) {
                const id = 'res-' + Math.random().toString(36).substr(2, 5);
                const html = `
                    <details class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" open>
                        <summary class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-50">
                            <div class="flex items-center gap-4">
                                <img src="${URL.createObjectURL(file)}" class="w-12 h-12 rounded-lg object-cover">
                                <div id="st-${id}" class="font-bold text-blue-500">กำลังวิเคราะห์...</div>
                            </div>
                            <span class="text-slate-400">▼</span>
                        </summary>
                        <div class="p-4 border-t border-slate-100 flex flex-col items-center bg-slate-50">
                            <img id="img-${id}" class="max-w-full h-auto rounded-xl shadow-lg border-4 border-white hidden">
                        </div>
                    </details>`;
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', html);

                const fd = new FormData();
                fd.append('image', file);
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    if(data.success) {
                        const imgTag = document.getElementById(`img-${id}`);
                        imgTag.src = "data:image/jpeg;base64," + data.image;
                        imgTag.classList.remove('hidden');
                        const st = document.getElementById(`st-${id}`);
                        st.innerText = data.status === "MISSING" ? `🚨 พบจุดผิดปกติ (${data.pixel_count} px)` : "✅ สถานะปกติ";
                        st.className = `font-bold ${data.status === 'MISSING' ? 'text-red-600' : 'text-green-600'}`;
                    } else { throw new Error(data.error); }
                } catch(err) { 
                    addLog("❌ ติดต่อเครื่องไม่ได้: เช็ค ngrok/app.py");
                    document.getElementById(`st-${id}`).innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
                }
            }
        };

        // การทำงานวิดีโอ
        document.getElementById('videoInput').onchange = (e) => {
            if(e.target.files[0]) {
                vSource.src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('vStatus').innerText = "วิดีโอโหลดเสร็จแล้ว พร้อมเริ่มวิเคราะห์";
                addLog("โหลดวิดีโอสำเร็จ");
            }
        };

        async function startAI() {
            if (!vSource.src) return alert("กรุณาเลือกวิดีโอก่อนครับ");
            
            addLog("🎥 กำลังสั่งให้วิดีโอเริ่มเล่น...");
            
            try {
                // บังคับให้วิดีโอต้นฉบับเล่น
                await vSource.play(); 
                
                // ตรวจสอบว่าวิดีโอมีขนาดกว้างยาวเท่าไหร่ แล้วตั้งค่า Canvas ให้ตรงกัน
                vCanvas.width = vSource.videoWidth;
                vCanvas.height = vSource.videoHeight;
                
                addLog("🚀 เริ่มประมวลผลเฟรมภาพแบบ Real-time...");
                processFrame();
            } catch (err) {
                addLog("❌ Error: วิดีโอเล่นไม่ได้ (เช็คว่าไฟล์เสียหรือไม่)");
                console.error(err);
            }
        }

        async function processFrame() {
            // ถ้าวิดีโอหยุด หรือจบ ให้เลิกทำ
            if (vSource.paused || vSource.ended) return;

            // 1. วาดภาพปัจจุบันจากวิดีโอลงไปในช่อง Canvas ฝั่งขวาทันที (เพื่อให้เห็นว่าระบบทำงาน)
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);

            // 2. ส่งเฟรมนี้ไปให้ AI ในเครื่องประมวลผล
            vCanvas.toBlob(async (blob) => {
                if (!blob) return;
                
                const fd = new FormData();
                fd.append('image', blob, 'frame.jpg');
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success && data.image) {
                        const img = new Image();
                        img.onload = () => {
                            // 3. เมื่อ AI ส่งภาพที่มีกรอบสี/สีแดงกลับมา ให้วาดทับลงบน Canvas เดิม
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            
                            // อัปเดตแถบสีสถานะ
                            updateVStatus(data.status);
                            
                            // 4. วนลูปเรียกเฟรมถัดไป
                            requestAnimationFrame(processFrame);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) {
                    // ถ้าหลุด ให้รอครึ่งวินาทีแล้วลองใหม่
                    setTimeout(processFrame, 500);
                }
            }, 'image/jpeg', 0.4); 
        }

        function updateVStatus(s) {
            const el = document.getElementById('vStatus');
            el.innerText = s === "MISSING" ? "🚨 ตรวจพบความผิดปกติ" : "✅ สถานะปกติ";
            el.className = `text-center py-4 rounded-xl text-xl font-bold transition-all ${s === 'MISSING' ? 'bg-red-600 text-white animate-pulse' : 'bg-green-500 text-white'}`;
        }
    </script>
</body>
</html>
