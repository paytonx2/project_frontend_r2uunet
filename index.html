<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-Net Debug Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #vCanvas { background-color: #000; width: 100%; height: auto; border-radius: 1rem; border: 2px solid #3b82f6; }
        .log-box { font-family: monospace; font-size: 10px; height: 100px; overflow-y: auto; background: #000; color: #0f0; p: 10px; border-radius: 5px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 shadow-xl flex-shrink-0">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ Control Panel</h2>
        
        <div class="mb-6">
            <label class="block text-sm mb-2 text-slate-400">Pixel Threshold</label>
            <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-2 rounded border border-slate-600 outline-none text-white">
        </div>

        <div class="mb-6">
            <label class="block text-sm mb-2 text-slate-400">Confidence: <span id="confVal" class="text-blue-400 font-bold">0.35</span></label>
            <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
        </div>

        <div class="mb-4">
            <p class="text-xs uppercase text-slate-500 font-bold mb-2">System Logs</p>
            <div id="systemLog" class="log-box p-2">Ready to work...</div>
        </div>

        <button onclick="window.location.reload()" class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded font-bold transition">RELOAD SYSTEM</button>
    </div>

    <div class="flex-1 p-4 md:p-8">
        <header class="mb-6">
            <h1 class="text-3xl font-black text-slate-800 uppercase">R2U-Net Inspection</h1>
            <p class="text-slate-500">Mode: <span id="currentModeDisplay">Image Analysis</span></p>
        </header>

        <div class="flex gap-4 mb-6">
            <button onclick="setMode('image')" id="btnImage" class="px-6 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg">📷 ภาพนิ่ง</button>
            <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2 rounded-lg font-bold bg-slate-200 text-slate-600">🎥 วิดีโอ</button>
        </div>

        <div id="imageSection" class="space-y-4">
            <div class="bg-white p-8 rounded-2xl border-4 border-dashed border-slate-200 text-center cursor-pointer" onclick="document.getElementById('imageInput').click()">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-500 font-bold">คลิกเพื่ออัปโหลดรูปภาพ (Multiple)</p>
            </div>
            <div id="imageResultsList" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="videoSection" class="hidden space-y-4">
            <input type="file" id="videoInput" accept="video/*" class="w-full p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
            <div id="vStatus" class="text-center py-4 rounded-xl text-xl font-black bg-slate-200 text-slate-500">NO VIDEO LOADED</div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <video id="vSource" controls class="w-full rounded-2xl bg-black shadow-lg"></video>
                <canvas id="vCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. ตรวจสอบ API URL ให้ชัวร์ว่าลงท้ายด้วย /predict
        const API_URL = "https://phuwarin-my-cnn-api.hf.space/predict"; 
        
        const systemLog = document.getElementById('systemLog');
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d', { willReadFrequently: true });

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            systemLog.innerHTML += `<div>[${time}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
            console.log(msg);
        }

        // 2. สลับโหมด
        function setMode(m) {
            addLog("Switching to " + m + " mode");
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('currentModeDisplay').innerText = m === 'image' ? 'Image Analysis' : 'Video Real-time Analysis';
            document.getElementById('btnImage').className = m === 'image' ? 'px-6 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg' : 'px-6 py-2 rounded-lg font-bold bg-slate-200 text-slate-600';
            document.getElementById('btnVideo').className = m === 'video' ? 'px-6 py-2 rounded-lg font-bold bg-blue-600 text-white shadow-lg' : 'px-6 py-2 rounded-lg font-bold bg-slate-200 text-slate-600';
            if(m === 'image') vSource.pause();
        }

        // 3. IMAGE LOGIC
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const files = e.target.files;
            addLog(`Selected ${files.length} images`);
            
            for (let file of files) {
                const id = 'img-' + Math.random().toString(36).substr(2, 9);
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', `
                    <div id="${id}" class="bg-white p-4 rounded-xl shadow-md border flex gap-4 items-center">
                        <img src="${URL.createObjectURL(file)}" class="w-24 h-24 object-cover rounded shadow">
                        <div class="flex-1 font-bold text-slate-700">${file.name}</div>
                        <div id="status-${id}" class="text-blue-500 animate-pulse">Analyzing...</div>
                        <img id="resImg-${id}" class="w-24 h-24 object-cover rounded border-2 border-blue-500 hidden">
                    </div>
                `);

                const fd = new FormData();
                fd.append('image', file);
                fd.append('conf_threshold', document.getElementById('confThreshold').value);
                fd.append('px_threshold', document.getElementById('pxThreshold').value);

                try {
                    addLog(`API Call for ${file.name}...`);
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    addLog(`Result for ${file.name}: ${data.status}`);
                    document.getElementById('resImg-'+id).src = "data:image/jpeg;base64," + data.image;
                    document.getElementById('resImg-'+id).classList.remove('hidden');
                    document.getElementById('status-'+id).innerText = data.status;
                    document.getElementById('status-'+id).classList.remove('animate-pulse');
                    document.getElementById('status-'+id).className = data.status === "MISSING" ? "text-red-600 font-black" : "text-green-600 font-black";
                } catch(err) {
                    addLog("API Error: " + err.message);
                }
            }
        });

        // 4. VIDEO LOGIC
        document.getElementById('videoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                addLog("Video file selected: " + file.name);
                vSource.src = URL.createObjectURL(file);
                document.getElementById('vStatus').innerText = "READY: PRESS PLAY";
            }
        });

        async function analyzeFrame() {
            if (vSource.paused || vSource.ended) return;

            vCanvas.width = vSource.videoWidth;
            vCanvas.height = vSource.videoHeight;
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);

            vCanvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('image', blob, 'f.jpg');
                fd.append('conf_threshold', document.getElementById('confThreshold').value);
                fd.append('px_threshold', document.getElementById('pxThreshold').value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            updateVStatus(data.status);
                            requestAnimationFrame(analyzeFrame);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) {
                    addLog("Video frame error");
                    setTimeout(analyzeFrame, 1000);
                }
            }, 'image/jpeg', 0.4);
        }

        function updateVStatus(s) {
            const el = document.getElementById('vStatus');
            el.innerText = s === "MISSING" ? "🚨 DEFECT DETECTED" : "✅ SYSTEM NORMAL";
            el.className = `text-center py-4 rounded-xl text-xl font-black ${s === 'MISSING' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
        }

        vSource.onplay = () => {
            addLog("Video started");
            analyzeFrame();
        };
    </script>
</body>
</html>
