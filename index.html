<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-NET REAL-TIME INSPECTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 12px; }
        video, canvas { background: #000; width: 100%; border-radius: 16px; border: 2px solid #fff; min-height: 250px; }
        .active-mode { background-color: #2563eb !important; color: white !important; }
        .status-badge { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ แผงควบคุม</h2>
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2 font-medium">Pixel Threshold</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2 font-medium">Confidence: <span id="confVal" class="text-blue-400 font-bold">0.35</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full h-2 bg-slate-700 rounded-lg appearance-none accent-blue-500 cursor-pointer">
            </div>
            
            <div id="systemLog" class="log-box text-xs mt-4">พร้อมสำหรับการตรวจสอบ...</div>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl font-bold transition-all border border-slate-700">🔄 รีเซ็ตระบบ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-8">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">R2U-NET <span class="text-blue-600">LIVE</span></h1>
            <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
                <button onclick="setMode('image')" id="btnImage" class="px-6 py-2.5 rounded-xl font-bold transition-all text-slate-500">📷 ภาพนิ่ง</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2.5 rounded-xl font-bold transition-all active-mode text-white">🎥 เรียลไทม์</button>
            </div>
        </header>

        <div id="videoSection" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-center">
                <div class="flex-1 w-full">
                    <p class="text-sm font-bold text-slate-500 mb-2 uppercase">ตัวเลือกการนำเข้า</p>
                    <input type="file" id="videoInput" accept="video/*" class="w-full text-sm" onchange="startProcessing(this)">
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="startCamera()" class="flex-1 md:flex-none px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                        📹 เปิดกล้องสด
                    </button>
                    <button onclick="stopEverything()" class="px-4 py-3 bg-red-100 text-red-600 font-bold rounded-xl hover:bg-red-200 transition-all">
                        ⏹️ หยุด
                    </button>
                </div>
            </div>
            
            <div id="vStatus" class="status-badge text-center py-6 rounded-2xl text-2xl font-black bg-slate-100 text-slate-400 border border-slate-200 shadow-inner">
                ระบบสแตนด์บาย
            </div>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div class="relative group">
                    <p class="text-sm font-bold text-slate-500 mb-2">ภาพต้นฉบับ</p>
                    <video id="vSource" muted playsinline class="w-full"></video>
                    <div class="absolute top-10 left-4 bg-black/50 px-2 py-1 rounded text-[10px] text-white">LIVE FEED</div>
                </div>
                <div class="relative">
                    <p class="text-sm font-bold text-blue-600 mb-2">AI SEGMENTATION & BBOX</p>
                    <canvas id="vCanvas"></canvas>
                    <div id="fpsCounter" class="absolute top-10 right-4 text-green-400 text-xs font-mono"></div>
                </div>
            </div>
        </div>

        <div id="imageSection" class="hidden space-y-6">
            <div onclick="document.getElementById('imageInput').click()" class="bg-white p-12 rounded-[2rem] border-4 border-dashed border-slate-200 text-center cursor-pointer hover:border-blue-400 transition-all shadow-sm">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-600 font-bold text-xl">📤 คลิกเพื่ออัปโหลดรูปภาพ</p>
            </div>
            <div id="imageResultsList" class="grid grid-cols-1 gap-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://cf2a-223-206-219-65.ngrok-free.app/predict"; 
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d');
        const systemLog = document.getElementById('systemLog');
        
        let isRunning = false;
        let currentStream = null;
        let lastTime = 0;

        function addLog(msg) {
            systemLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        function setMode(m) {
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('btnImage').classList.toggle('active-mode', m === 'image');
            document.getElementById('btnVideo').classList.toggle('active-mode', m === 'video');
            if(m === 'image') stopEverything();
        }

        function stopEverything() {
            isRunning = false;
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            vSource.pause();
            vSource.src = "";
            vSource.srcObject = null;
            addLog("⏹️ หยุดการทำงาน");
            document.getElementById('vStatus').innerText = "หยุดการทำงาน";
            document.getElementById('vStatus').className = "status-badge text-center py-6 rounded-2xl text-2xl font-black bg-slate-100 text-slate-400 border border-slate-200 shadow-inner";
        }

        async function startCamera() {
            stopEverything();
            addLog("📸 กำลังเรียกใช้งานกล้อง...");
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
                vSource.srcObject = currentStream;
                vSource.onloadedmetadata = () => {
                    vCanvas.width = vSource.videoWidth;
                    vCanvas.height = vSource.videoHeight;
                    vSource.play();
                    isRunning = true;
                    addLog("🚀 เริ่มการประมวลผลเรียลไทม์...");
                    renderLoop();
                };
            } catch (e) { addLog("❌ กล้องขัดข้อง: " + e.message); }
        }

        async function startProcessing(input) {
            const file = input.files[0];
            if (!file) return;
            stopEverything();
            addLog("📂 โหลดวิดีโอ: " + file.name);
            vSource.src = URL.createObjectURL(file);
            vSource.oncanplay = () => {
                if (isRunning) return;
                vCanvas.width = vSource.videoWidth;
                vCanvas.height = vSource.videoHeight;
                vSource.play();
                isRunning = true;
                renderLoop();
            };
        }

        async function renderLoop() {
            if (!isRunning || vSource.paused || vSource.ended) return;

            // วาดต้นฉบับลง Canvas ลับ
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);

            // ส่งเฟรมไปยัง AI
            vCanvas.toBlob(async (blob) => {
                if (!blob || !isRunning) return;
                
                const fd = new FormData();
                fd.append('image', blob, 'f.jpg');
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', document.getElementById('confThreshold').value);

                try {
                    const start = performance.now();
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success && isRunning) {
                        const img = new Image();
                        img.onload = () => {
                            // เคลียร์และวาดภาพที่มี Mask และ BBox จาก AI
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            
                            updateUI(data);
                            
                            // คำนวณความเร็ว (FPS)
                            const end = performance.now();
                            document.getElementById('fpsCounter').innerText = `Latency: ${Math.round(end - start)}ms`;
                            
                            requestAnimationFrame(renderLoop);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    } else {
                        requestAnimationFrame(renderLoop);
                    }
                } catch (e) { if(isRunning) setTimeout(renderLoop, 100); }
            }, 'image/jpeg', 0.4); // บีบอัดภาพเพื่อส่งผ่านเน็ตให้ไวที่สุด
        }

        function updateUI(data) {
            const el = document.getElementById('vStatus');
            if (data.status === "MISSING") {
                el.innerText = `🚨 ตรวจพบความผิดปกติ (${data.pixel_count} px)`;
                el.className = "status-badge text-center py-6 rounded-2xl text-2xl font-black bg-red-600 text-white shadow-lg animate-pulse";
            } else {
                el.innerText = "✅ ชิ้นส่วนครบถ้วน";
                el.className = "status-badge text-center py-6 rounded-2xl text-2xl font-black bg-green-500 text-white shadow-lg";
            }
        }

        // ส่วนของรูปภาพ (UI เดิม)
        document.getElementById('imageInput').onchange = async (e) => {
            for (let file of e.target.files) {
                const id = 'res-' + Math.random().toString(36).substr(2, 5);
                document.getElementById('imageResultsList').insertAdjacentHTML('afterbegin', `
                    <details class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" open>
                        <summary class="p-4 cursor-pointer hover:bg-slate-50 flex items-center gap-4">
                            <img src="${URL.createObjectURL(file)}" class="w-12 h-12 rounded-lg object-cover">
                            <div id="st-${id}" class="font-bold text-blue-500">กำลังวิเคราะห์...</div>
                        </summary>
                        <div class="p-4 border-t flex justify-center bg-slate-50">
                            <img id="img-${id}" class="max-w-full rounded-xl shadow-lg border-4 border-white hidden">
                        </div>
                    </details>
                `);
                const fd = new FormData();
                fd.append('image', file);
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', document.getElementById('confThreshold').value);
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    const imgTag = document.getElementById(`img-${id}`);
                    imgTag.src = "data:image/jpeg;base64," + data.image;
                    imgTag.classList.remove('hidden');
                    document.getElementById(`st-${id}`).innerText = data.status === "MISSING" ? "🚨 ผิดปกติ" : "✅ ปกติ";
                    document.getElementById(`st-${id}`).className = `font-bold ${data.status === 'MISSING' ? 'text-red-600' : 'text-green-600'}`;
                } catch(err) { addLog("❌ ข้อผิดพลาด API"); }
            }
        };

        document.getElementById('confThreshold').oninput = function() {
            document.getElementById('confVal').innerText = this.value;
        };
    </script>
</body>
</html>
