<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2U-NET INSPECTION PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 12px; }
        video, canvas { background: #000; width: 100%; min-height: 300px; border-radius: 16px; border: 2px solid #334155; display: block; }
        .active-mode { background-color: #2563eb !important; color: white !important; }
        .img-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #60a5fa; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 20; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ แผงควบคุม</h2>
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2">Pixel Threshold</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 outline-none text-blue-400 font-bold">
            </div>
            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm text-slate-400">Confidence</label>
                    <span id="valConfidence" class="text-blue-400 font-bold">0.35</span>
                </div>
                <input type="range" id="inpConfidence" min="0.10" max="0.95" step="0.05" value="0.35" 
                    oninput="document.getElementById('valConfidence').innerText = parseFloat(this.value).toFixed(2)">
            </div>
            <hr class="border-slate-800">
            <div id="systemLog" class="log-box text-xs">ระบบพร้อม...</div>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl font-bold border border-slate-700 mt-4">🔄 รีเซ็ตระบบ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center border-b pb-8">
            <h1 class="text-4xl font-extrabold text-slate-800">R2U-NET <span class="text-blue-600">PRO</span></h1>
            <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
                <button onclick="setMode('image')" id="btnImage" class="px-6 py-2.5 rounded-xl font-bold transition-all text-slate-500">📷 รูปภาพ</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2.5 rounded-xl font-bold transition-all active-mode text-white">🎥 วิดีโอ/กล้องสด</button>
            </div>
        </header>

        <div id="videoSection" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase mb-2">1. เลือกไฟล์วิดีโอ</p>
                    <input type="file" id="videoInput" accept="video/*" class="w-full text-sm" onchange="handleVideoUpload(this)">
                </div>
                <div class="flex items-end gap-2">
                    <button id="camBtn" onclick="toggleCamera()" class="flex-1 py-3 bg-slate-800 text-white font-bold rounded-xl">📹 เปิดกล้อง</button>
                    <button id="runBtn" onclick="toggleAI()" disabled class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl opacity-50">▶️ เริ่มรัน AI</button>
                </div>
            </div>

            <div id="vStatus" class="text-center py-5 rounded-2xl text-xl font-bold bg-slate-100 text-slate-400 border border-slate-200">
                รอนำเข้าวิดีโอ...
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div class="relative">
                    <span class="img-label">SOURCE</span>
                    <video id="vSource" controls muted playsinline loop crossorigin="anonymous"></video>
                </div>
                <div class="relative">
                    <span class="img-label">AI PREDICTION</span>
                    <canvas id="vCanvas"></canvas>
                </div>
            </div>
        </div>

        <div id="imageSection" class="hidden space-y-6">
            <div onclick="document.getElementById('imageInput').click()" class="bg-white p-12 rounded-[2rem] border-4 border-dashed border-slate-200 text-center cursor-pointer shadow-sm">
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                <p class="text-slate-600 font-bold text-xl">📤 คลิกเพื่ออัปโหลดรูปภาพ</p>
            </div>
            <div id="imageResultsList" class="flex flex-col gap-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://phuwarin-my-cnn-api.hf.space/predict"; 
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d');
        const systemLog = document.getElementById('systemLog');
        
        let isAIRunning = false;
        let isCameraOpen = false;

        function addLog(msg) {
            systemLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        // --- ฟังชันนำเข้าวิดีโอแบบสากล (ใช้ Blob URL) ---
        function handleVideoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            addLog("⏳ กำลังเตรียมไฟล์: " + file.name);
            
            // ยกเลิก URL เก่าเพื่อคืน Memory
            if (vSource.src) URL.revokeObjectURL(vSource.src);
            if (isCameraOpen) stopAll();

            const url = URL.createObjectURL(file);
            vSource.src = url;
            vSource.load();

            vSource.onloadedmetadata = () => {
                addLog("✅ วิดีโอโหลดสำเร็จ: " + vSource.videoWidth + "x" + vSource.videoHeight);
                vCanvas.width = vSource.videoWidth;
                vCanvas.height = vSource.videoHeight;
                
                // เปิดปุ่มรัน AI
                document.getElementById('runBtn').disabled = false;
                document.getElementById('runBtn').classList.remove('opacity-50');
                document.getElementById('vStatus').innerText = "โหลดเสร็จแล้ว | กดเริ่มรัน AI";
            };

            vSource.onerror = () => {
                addLog("❌ เบราว์เซอร์เล่นไฟล์นี้ไม่ได้ ลองเปลี่ยนเป็น MP4 มาตรฐาน");
            };
        }

        async function toggleCamera() {
            if (!isCameraOpen) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    vSource.srcObject = stream;
                    vSource.play();
                    isCameraOpen = true;
                    document.getElementById('runBtn').disabled = false;
                    document.getElementById('runBtn').classList.remove('opacity-50');
                    addLog("📸 กล้องเปิดใช้งาน");
                } catch (e) { addLog("❌ กล้องขัดข้อง"); }
            } else { stopAll(); }
        }

        function toggleAI() {
            isAIRunning = !isAIRunning;
            const btn = document.getElementById('runBtn');
            if (isAIRunning) {
                btn.innerText = "⏸️ หยุด AI";
                btn.classList.replace('bg-blue-600', 'bg-red-500');
                addLog("🚀 เริ่มประมวลผล...");
                vSource.play();
                renderLoop();
            } else {
                btn.innerText = "▶️ เริ่มรัน AI";
                btn.classList.replace('bg-red-500', 'bg-blue-600');
                addLog("⏸️ หยุดชั่วคราว");
            }
        }

        async function renderLoop() {
            if (!isAIRunning || vSource.paused || vSource.ended) return;

            // วาดลง Canvas ลับเพื่อส่ง
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = vSource.videoWidth;
            tempCanvas.height = vSource.videoHeight;
            tempCanvas.getContext('2d').drawImage(vSource, 0, 0);

            tempCanvas.toBlob(async (blob) => {
                if (!blob || !isAIRunning) return;

                const fd = new FormData();
                fd.append('image', blob, 'frame.jpg');
                fd.append('px_threshold', document.getElementById('pxThreshold').value);
                fd.append('conf_threshold', document.getElementById('inpConfidence').value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    if (data.success && isAIRunning) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            updateStatus(data.status, data.pixel_count);
                            requestAnimationFrame(renderLoop);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) { 
                    if(isAIRunning) setTimeout(renderLoop, 100); 
                }
            }, 'image/jpeg', 0.6);
        }

        function updateStatus(s, px) {
            const el = document.getElementById('vStatus');
            if (s === "MISSING") {
                el.innerText = `🚨 ตรวจพบ: ${px} PX`;
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-red-600 text-white animate-pulse";
            } else {
                el.innerText = "✅ สถานะ: ปกติ";
                el.className = "text-center py-5 rounded-2xl text-xl font-bold bg-green-500 text-white";
            }
        }

        function stopAll() {
            isAIRunning = false;
            isCameraOpen = false;
            if (vSource.srcObject) vSource.srcObject.getTracks().forEach(t => t.stop());
            vSource.srcObject = null;
            vSource.src = "";
            addLog("⏹️ เคลียร์ระบบ");
        }

        function setMode(m) {
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
            document.getElementById('btnImage').classList.toggle('active-mode', m === 'image');
            document.getElementById('btnVideo').classList.toggle('active-mode', m === 'video');
        }
    </script>
</body>
</html>
