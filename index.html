<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Inspection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
        .log-box { font-family: monospace; font-size: 11px; height: 120px; overflow-y: auto; background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 12px; }
        video, canvas { background: #000; width: 100%; border-radius: 16px; border: 2px solid #fff; min-height: 200px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex-shrink-0 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">⚙️ แผงควบคุม</h2>
        <div class="space-y-6">
            <button onclick="unlockBrowser()" id="unlockBtn" class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-black font-bold rounded-xl animate-bounce">🔓 1. กดตรงนี้เพื่อเปิดระบบ</button>
            
            <div>
                <label class="block text-sm text-slate-400 mb-2">Pixel Threshold</label>
                <input type="number" id="pxThreshold" value="15" class="w-full bg-slate-800 p-2 rounded-lg border border-slate-700 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">Confidence: <span id="confVal" class="text-blue-400">0.35</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.95" step="0.05" value="0.35" class="w-full accent-blue-500">
            </div>
            
            <div id="systemLog" class="log-box">รอการเริ่มต้น...</div>
            <button onclick="location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all">🔄 รีเซ็ตหน้าเว็บ</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center border-b pb-6">
            <h1 class="text-3xl font-bold text-slate-800">R2U-NET INSPECTION</h1>
            <div class="flex gap-2 bg-white p-1 rounded-2xl shadow-sm border">
                <button onclick="setMode('image')" id="btnImage" class="px-6 py-2 rounded-xl font-bold bg-blue-600 text-white">📷 รูปภาพ</button>
                <button onclick="setMode('video')" id="btnVideo" class="px-6 py-2 rounded-xl font-bold text-slate-500">🎥 วิดีโอ</button>
            </div>
        </header>

        <div id="videoSection" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-4 items-center">
                <input type="file" id="videoInput" accept="video/*" class="flex-1">
                <button onclick="startAI()" id="startBtn" class="w-full sm:w-auto px-10 py-3 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg">▶️ 2. เริ่มวิเคราะห์</button>
            </div>
            
            <div id="vStatus" class="text-center py-5 rounded-2xl text-xl font-bold bg-slate-100 text-slate-400">กรุณาเลือกไฟล์วิดีโอ</div>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div>
                    <p class="text-sm font-bold text-slate-500 mb-2 font-bold">วิดีโอต้นฉบับ</p>
                    <video id="vSource" controls muted playsinline></video>
                </div>
                <div>
                    <p class="text-sm font-bold text-blue-600 mb-2 font-bold">ผลการวิเคราะห์ AI</p>
                    <canvas id="vCanvas"></canvas>
                </div>
            </div>
        </div>

        <div id="imageSection" class="hidden space-y-6">
             <input type="file" id="imageInput" accept="image/*" multiple>
             <div id="imageResultsList"></div>
        </div>
    </div>

    <script>
        // *** แก้ URL ตรงนี้ให้เป็น ngrok ปัจจุบัน ***
        const API_URL = "https://adff-223-206-219-65.ngrok-free.app/predict"; 
        
        const systemLog = document.getElementById('systemLog');
        const vSource = document.getElementById('vSource');
        const vCanvas = document.getElementById('vCanvas');
        const ctx = vCanvas.getContext('2d');
        const confSli = document.getElementById('confThreshold');
        const pxInp = document.getElementById('pxThreshold');

        function addLog(msg) {
            systemLog.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            systemLog.scrollTop = systemLog.scrollHeight;
        }

        // ฟังก์ชันสำคัญ: ปลดล็อก Browser
        function unlockBrowser() {
            vSource.play().then(() => {
                vSource.pause();
                addLog("🔓 ปลดล็อก Browser สำเร็จ!");
                document.getElementById('unlockBtn').classList.remove('animate-bounce');
                document.getElementById('unlockBtn').innerText = "✅ ระบบพร้อมแล้ว";
                document.getElementById('unlockBtn').className = "w-full py-3 bg-green-500 text-white font-bold rounded-xl opacity-50";
            }).catch(e => addLog("⚠️ กดปุ่มอีกครั้งเพื่อปลดล็อก"));
        }

        function setMode(m) {
            document.getElementById('imageSection').classList.toggle('hidden', m !== 'image');
            document.getElementById('videoSection').classList.toggle('hidden', m !== 'video');
        }

        document.getElementById('videoInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                vSource.src = URL.createObjectURL(file);
                vSource.onloadedmetadata = () => {
                    vCanvas.width = vSource.videoWidth;
                    vCanvas.height = vSource.videoHeight;
                    document.getElementById('vStatus').innerText = "วิดีโอโหลดสำเร็จ! กดเริ่มวิเคราะห์";
                    addLog("📂 โหลดวิดีโอ: " + vSource.videoWidth + "px");
                    ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);
                };
            }
        };

        async function startAI() {
            if (!vSource.src) return alert("เลือกไฟล์วิดีโอก่อน");
            addLog("🎥 เริ่มต้นวิเคราะห์...");
            vSource.play();
            processFrame();
        }

        function processFrame() {
            if (vSource.paused || vSource.ended) return;

            // วาดภาพปัจจุบันลงไปก่อนเสมอ
            ctx.drawImage(vSource, 0, 0, vCanvas.width, vCanvas.height);

            vCanvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('image', blob, 'f.jpg');
                fd.append('conf_threshold', confSli.value);
                fd.append('px_threshold', pxInp.value);

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, vCanvas.width, vCanvas.height);
                            ctx.drawImage(img, 0, 0, vCanvas.width, vCanvas.height);
                            updateVStatus(data.status);
                            requestAnimationFrame(processFrame);
                        };
                        img.src = "data:image/jpeg;base64," + data.image;
                    }
                } catch (e) { setTimeout(processFrame, 500); }
            }, 'image/jpeg', 0.5);
        }

        function updateVStatus(s) {
            const el = document.getElementById('vStatus');
            el.innerText = s === "MISSING" ? "🚨 พบจุดผิดปกติ!" : "✅ ชิ้นส่วนปกติ";
            el.className = `text-center py-5 rounded-2xl text-xl font-bold transition-all ${s === 'MISSING' ? 'bg-red-600 text-white' : 'bg-green-500 text-white'}`;
        }
    </script>
</body>
</html>
